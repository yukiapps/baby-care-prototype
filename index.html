<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baby Care | Prototype</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#293648;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:white;padding:22px 18px;border-bottom:1px solid #e6eaf1}header>div,main{max-width:720px;margin:auto}h1{margin:0;font-size:25px}small,.sub{color:#778498}main{padding:16px 16px 60px}.tabs{display:flex;gap:5px;background:#e8edf5;padding:5px;border-radius:14px;margin-bottom:16px}.tabs button{flex:1;background:transparent;border:0;border-radius:10px;padding:12px;font-weight:700;color:#5b6b81}.tabs button.active{background:white;color:#334b80;box-shadow:0 1px 5px #0001}.card{background:white;border:1px solid #e5eaf1;border-radius:17px;padding:17px;margin-bottom:15px}h2{font-size:18px;margin:0 0 13px}h3{font-size:15px;margin:17px 0 6px}.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tag{background:#fff;border:1px solid #d9e1ed;border-radius:12px;padding:15px 3px;font-size:14px;font-weight:700;color:#42546c}.tag.active{background:#eaf0ff;border:2px solid #6585c5}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #d9e1ed;border-radius:11px;background:white;padding:12px;font:inherit;color:inherit}textarea{min-height:75px}.primary{width:100%;background:#526fb5;color:white;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-top:16px}.secondary{background:white;border:1px solid #d9e1ed;border-radius:10px;padding:9px;color:#43556f}.line{border-bottom:1px solid #edf0f5;padding:12px 0}.line:last-child{border:0}.line p{font-size:13px;color:#718093;margin:4px 0}.line strong{font-size:14px}.split{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#718093;font-size:13px;line-height:1.6}.bar{height:9px;background:#edf1f7;border-radius:10px;overflow:hidden;margin:5px 0 10px}.bar span{display:block;height:100%;background:#8ca5dc}.report{font-size:14px;line-height:1.8}.report p{margin:6px 0 15px}.hidden{display:none}.badge{background:#fff0dc;color:#8e581a;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}footer{text-align:center;font-size:11px;color:#9aa4b3;padding:20px}</style></head><body><header><div class="split"><div><h1>Baby Care <small style="font-size:12px">v0.3</small></h1><small>赤ちゃんの1日を、やさしく伝える</small></div><span class="badge">架空データ専用</span></div></header><main><nav class="tabs"><button class="active" data-tab="record">記録</button><button data-tab="analysis">分析</button><button data-tab="report">レポート</button></nav><section id="record"><div class="card"><h2>行動を記録</h2><div class="tags" id="tags"></div><label>記録した時刻</label><select id="minutes"><option value="0">今</option><option value="5">5分前</option><option value="10">10分前</option><option value="20">20分前</option><option value="30">30分前</option><option value="60">1時間前</option></select><div id="detail"></div><label>メモ（任意）</label><textarea id="memo" placeholder="例：抱っこで落ち着いて入眠しました"></textarea><button class="primary" id="add">記録を追加</button></div><div class="card"><div class="split"><h2>最近の記録</h2><button class="secondary" id="reset">サンプルに戻す</button></div><div id="entries"></div></div></section><section id="analysis" class="hidden"><div class="card"><h2>行動の集計</h2><p class="muted">記録イベントの件数を表示します。睡眠時間や授乳間隔の計算は今後追加します。</p><div id="stats"></div></div><div class="card"><h2>タイムライン</h2><div id="timeline"></div></div></section><section id="report" class="hidden"><div class="card"><h2>保護者向けレポート（下書き）</h2><p class="muted">記録に基づくルール・定型文による試作です。共有前に必ず助産師さんが確認してください。</p><div id="reportBody" class="report"></div><button class="secondary" id="copy">文章をコピー</button></div><div class="card"><h2>文章の根拠となる記録</h2><div id="evidence"></div></div></section><footer>デモ専用 · 実際の赤ちゃんや保護者の個人情報を入力しないでください</footer></main><script>
(()=>{'use strict';const types=[['sleep','😴','睡眠'],['feed','🍼','授乳'],['diaper','🌿','排泄'],['soothe','🤲','寝かしつけ'],['mood','😊','ご機嫌'],['cry','💧','泣いた']];const fields={sleep:[['phase','内容',['眠り始めた','目が覚めた']]],feed:[['amount','飲んだ量（ml）',null],['result','様子',['飲めた','少し飲んだ','飲まなかった']]],diaper:[['kind','内容',['おしっこ','うんち','両方']]],soothe:[['method','方法',['抱っこ','トントン','声かけ','ベッドで見守り','その他']]],mood:[['state','様子',['にこにこ','落ち着いている','周囲を見ている']]],cry:[['response','対応',['抱っこ','授乳','おむつ交換','見守り','その他']]]};const now=Date.now();const sample=[{type:'sleep',at:now-7200000,detail:{phase:'眠り始めた'},memo:'抱っこで落ち着いたあとに入眠'},{type:'feed',at:now-10800000,detail:{amount:'80',result:'飲めた'},memo:'落ち着いて飲めました'},{type:'mood',at:now-14400000,detail:{state:'にこにこ'},memo:'声をかけると笑顔が見られました'},{type:'diaper',at:now-18000000,detail:{kind:'おしっこ'},memo:''},{type:'soothe',at:now-21000000,detail:{method:'抱っこ'},memo:'ゆっくり揺れると落ち着きました'},{type:'sleep',at:now-25200000,detail:{phase:'目が覚めた'},memo:''},{type:'sleep',at:now-32400000,detail:{phase:'眠り始めた'},memo:''}];const key='baby-care-demo-v03';let entries;try{const saved=JSON.parse(localStorage.getItem(key));entries=Array.isArray(saved)?saved:sample}catch{entries=sample}let chosen='sleep';const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=t=>types.find(x=>x[0]===t)?.[2]||t;const time=t=>new Date(t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});const desc=e=>Object.values(e.detail||{}).filter(Boolean).join('・');function save(){try{localStorage.setItem(key,JSON.stringify(entries))}catch{}}function tags(){$('tags').innerHTML=types.map(t=>'<button class="tag '+(chosen===t[0]?'active':'')+'" data-type="'+t[0]+'">'+t[1]+' '+t[2]+'</button>').join('');$('tags').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=b.dataset.type;tags();detail()})}function detail(){$('detail').innerHTML=(fields[chosen]||[]).map(f=>'<label>'+f[1]+'</label>'+(f[2]?'<select id="f_'+f[0]+'">'+f[2].map(v=>'<option>'+v+'</option>').join('')+'</select>':'<input id="f_'+f[0]+'" type="number" min="0" max="500" inputmode="numeric" placeholder="任意">')).join('')}function line(e){return '<div class="line"><strong>'+escape(time(e.at))+' · '+escape(name(e.type))+'</strong><p>'+escape(desc(e))+(e.memo?' · '+escape(e.memo):'')+'</p></div>'}function render(){const sorted=[...entries].sort((a,b)=>b.at-a.at);$('entries').innerHTML=sorted.slice(0,25).map(line).join('')||'<p class="muted">記録がありません</p>';$('timeline').innerHTML=sorted.map(line).join('')||'<p class="muted">記録がありません</p>';$('evidence').innerHTML=sorted.slice(0,12).map(line).join('')||'<p class="muted">記録がありません</p>';$('stats').innerHTML=types.map(t=>{const count=entries.filter(e=>e.type===t[0]).length;return '<div class="split"><span>'+t[1]+' '+t[2]+'</span><strong>'+count+'件</strong></div><div class="bar"><span style="width:'+(entries.length?count/entries.length*100:0)+'%"></span></div>'}).join('');const n=t=>entries.filter(e=>e.type===t).length;const sections=[];if(n('sleep'))sections.push(['睡眠','眠り始めや目覚めについて'+n('sleep')+'件の記録がありました。今回の観察だけで普段の睡眠リズムを判断するものではありません。']);if(n('feed')){const amounts=entries.filter(e=>e.type==='feed').map(e=>Number(e.detail?.amount)).filter(x=>Number.isFinite(x)&&x>0);sections.push(['授乳','授乳の記録が'+n('feed')+'件ありました。'+(amounts.length?'記録された哺乳量は'+amounts.join('ml、')+'mlです。':'' )])}if(n('diaper'))sections.push(['排泄','排泄に関する記録が'+n('diaper')+'件ありました。']);if(n('soothe'))sections.push(['寝かしつけ','寝かしつけに関する記録が'+n('soothe')+'件ありました。']);if(n('mood')||n('cry'))sections.push(['ご機嫌・泣いた場面','ご機嫌のよい様子が'+n('mood')+'件、泣いた場面が'+n('cry')+'件記録されました。']);const notes=sorted.filter(e=>e.memo?.trim()).slice(0,2);if(notes.length)sections.push(['スタッフが見たご様子',notes.map(e=>'「'+e.memo.trim()+'」').join('、')+'という記録がありました。']);if(!sections.length)sections.push(['観察のまとめ','まだ記録がありません。']);$('reportBody').innerHTML='<p>滞在中のご様子を、スタッフの記録からお伝えします。</p>'+sections.map(s=>'<h3>'+escape(s[0])+'</h3><p>'+escape(s[1])+'</p>').join('')+'<p class="muted">※自動生成された下書きです。担当助産師の確認・修正後に共有してください。</p>';return '滞在中のご様子を、スタッフの記録からお伝えします。\n\n'+sections.map(s=>s[0]+'\n'+s[1]).join('\n\n')+'\n\n※担当助産師による確認後に共有してください。'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['record','analysis','report'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));render()});$('add').onclick=()=>{const d={};(fields[chosen]||[]).forEach(f=>d[f[0]]=$('f_'+f[0]).value);entries.push({type:chosen,at:Date.now()-Number($('minutes').value)*60000,detail:d,memo:$('memo').value.trim()});save();$('memo').value='';render();$('add').textContent='記録しました ✓';setTimeout(()=>$('add').textContent='記録を追加',1200)};$('reset').onclick=()=>{if(confirm('入力したデモ記録を消してサンプルに戻しますか？')){entries=sample.map(e=>({...e}));save();render()}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(render());$('copy').textContent='コピーしました ✓'}catch{alert('コピーできませんでした')}};tags();detail();render()})();
</script></body></html>
